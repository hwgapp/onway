<!doctype html>
<html>
<body>
<div id="root"></div>
<script>
  var h = window.React.createElement;
  var root = ReactDOM.createRoot(document.getElementById("root"));
  var Tag = window.Onway.Tag;
  root.render(
    h("div", { style: { display: "flex", gap: "8px", padding: "20px" } },
      h(Tag, {}, "Gần đây"),
      h(Tag, { selected: true }, "4 chỗ"),
      h(Tag, {}, "Giao nhanh")
    )
  );
</script>
</body>
</html>
