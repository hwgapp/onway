<!doctype html>
<html>
<body>
<div id="root"></div>
<script>
  var h = window.React.createElement;
  var root = ReactDOM.createRoot(document.getElementById("root"));
  var IconButton = window.Onway.IconButton;
  root.render(
    h("div", { style: { display: "flex", gap: "12px", padding: "20px" } },
      h(IconButton, { label: "Lọc", glyph: "≡" }),
      h(IconButton, { label: "Thêm mới", glyph: "+" }),
      h(IconButton, { label: "Đóng", glyph: "✕" })
    )
  );
</script>
</body>
</html>
