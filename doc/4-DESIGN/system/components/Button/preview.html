<!-- @dsCard group="Core UI" height=220 subtitle="primary / secondary / outline / ghost / destructive, 5 states" -->
<!doctype html>
<html>
<body>
<div id="root"></div>
<script>
  var h = window.React.createElement;
  var root = ReactDOM.createRoot(document.getElementById("root"));
  var Button = window.Onway.Button;
  root.render(
    h("div", { style: { display: "flex", flexDirection: "column", gap: "16px", padding: "20px", fontFamily: "var(--font-sans)" } },
      h("div", { style: { display: "flex", gap: "12px", flexWrap: "wrap" } },
        h(Button, { variant: "primary" }, "Đặt xe"),
        h(Button, { variant: "secondary" }, "Xem chi tiết"),
        h(Button, { variant: "outline" }, "Huỷ"),
        h(Button, { variant: "ghost" }, "Bỏ qua"),
        h(Button, { variant: "destructive" }, "Xoá tài khoản")
      ),
      h("div", { style: { display: "flex", gap: "12px", flexWrap: "wrap" } },
        h(Button, { variant: "primary", state: "loading" }, "Đang xử lý"),
        h(Button, { variant: "primary", state: "disabled" }, "Không khả dụng"),
        h(Button, { variant: "primary", size: "md" }, "Web 40px")
      )
    )
  );
</script>
</body>
</html>
