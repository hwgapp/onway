<!doctype html>
<html>
<body>
<div id="root"></div>
<script>
  var h = window.React.createElement;
  var root = ReactDOM.createRoot(document.getElementById("root"));
  var Avatar = window.Onway.Avatar;
  root.render(
    h("div", { style: { display: "flex", gap: "12px", padding: "20px", alignItems: "center" } },
      h(Avatar, { initials: "NM", size: 32 }),
      h(Avatar, { initials: "TA", size: 40 }),
      h(Avatar, { initials: "LB", size: 56 })
    )
  );
</script>
</body>
</html>
