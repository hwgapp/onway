<!-- @dsCard group="Status" height=200 subtitle="6 tones, sm / md, optional pulse" -->
<!doctype html>
<html>
<body>
<div id="root"></div>
<script>
  var h = window.React.createElement;
  var root = ReactDOM.createRoot(document.getElementById("root"));
  var StatusPill = window.Onway.StatusPill;
  root.render(
    h("div", { style: { display: "flex", flexDirection: "column", gap: "12px", padding: "20px" } },
      h("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } },
        h(StatusPill, { status: "searching", pulse: true }),
        h(StatusPill, { status: "pendingReview" }),
        h(StatusPill, { status: "inProgress" }),
        h(StatusPill, { status: "completed" }),
        h(StatusPill, { status: "disputed" }),
        h(StatusPill, { status: "cancelled" })
      ),
      h("div", { style: { display: "flex", gap: "8px" } },
        h(StatusPill, { status: "completed", size: "sm" }),
        h(StatusPill, { status: "disputed", size: "sm" })
      )
    )
  );
</script>
</body>
</html>
